
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Merchant Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d7dbe2;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .signup {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }

    a {
      color: #111827;
      font-weight: 600;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>Merchant Login</h1>

  <div class="subtitle">
    Log in to manage your PesaPal payment account.
  </div>

  <form id="loginForm">

    <label for="email">Email</label>

    <input
      id="email"
      type="email"
      placeholder="you@example.com"
      required
    >

    <label for="password">Password</label>

    <input
      id="password"
      type="password"
      placeholder="Your password"
      required
    >

    <button id="loginButton" type="submit">
      Log In
    </button>

  </form>

  <div id="message" class="message"></div>

  <div class="signup">
    Don't have an account?
    <a href="signup.html">Create one</a>
  </div>

</div>

<script>

  const SUPABASE_URL =
    "https://lxrdkforhtiudmghydqx.supabase.co";

  const SUPABASE_ANON_KEY =
    "YOUR_CURRENT_SUPABASE_PUBLISHABLE_KEY";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

  const form =
    document.getElementById("loginForm");

  const button =
    document.getElementById("loginButton");

  const message =
    document.getElementById("message");

  function showError(text) {
    message.textContent = text;
    message.className = "message error";
    message.style.display = "block";
  }

  form.addEventListener("submit", async (event) => {

    event.preventDefault();

    button.disabled = true;
    button.textContent = "Logging in...";
    message.style.display = "none";

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    try {

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        throw error;
      }

      if (!data.session) {
        throw new Error("Login session was not created.");
      }

      window.location.href = "dashboard.html";

    } catch (error) {

      console.error(error);

      showError(
        error.message ||
        "Unable to log in."
      );

      button.disabled = false;
      button.textContent = "Log In";
    }

  });

</script>

</body>
</html>
